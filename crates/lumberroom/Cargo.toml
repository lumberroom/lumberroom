[package]
name = "lumberroom"
version = "0.5.0"
edition = "2021"
rust-version = "1.83"
description = "Client for a lumberroom memory server. Runs on the machine holding the transcripts."
license = "Apache-2.0"
repository = "https://github.com/the-cybersapien/lumberroom"
homepage = "https://lumberroom.cloud"
readme = "README.md"
keywords = ["mcp", "memory", "cli", "lumberroom"]
categories = ["command-line-utilities"]

# One publishable artifact. It never depends on the server crate: the wire contract is redeclared
# here and pinned by tests/wire.rs, so a client cannot drag an embedding runtime or a database
# driver along behind it.
[lib]
name = "lumberroom"
path = "src/lib.rs"

[[bin]]
name = "lumberroom"
path = "src/main.rs"

[dependencies]
# HTTP to a possibly remote server. rustls rather than native-tls so the binary carries its own TLS
# and does not need OpenSSL on the machine it is copied to. default-features off keeps the
# feature set to what this client uses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# reqwest needs a runtime, and `login` binds a loopback listener: net and io-util are that listener,
# time is the sign-in deadline. Current-thread flavour, so no worker pool for a CLI.
# `sync` carries the semaphore that bounds extract concurrency: a provider answers a chunk in
# seconds and 34 chunks at once is a rate limit rather than a speedup.
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
# preserve_order because doctor, whoami and clients echo the server's JSON back and the owner reads
# those lines. A BTreeMap-backed Value alphabetises keys and silently reorders every report.
serde_json = { version = "1", features = ["preserve_order"] }
# PKCE S256 is a SHA-256 over the verifier, base64url-encoded with no padding.
sha2 = "0.10"
base64 = "0.22"
# `seal` and `unseal`. The key never leaves this machine, so the crypto lives here rather than
# behind the server: aes-gcm for the payload, hmac over the name so the server cannot enumerate a
# namespace by guessing it, hex because the lookup name travels in a query parameter.
#
# aes-gcm tracks the server's version so this workspace's one lockfile carries a single AES stack.
# The crate version cannot affect interoperability: AES-256-GCM's output is fixed by the standard,
# and what the two clients actually have to agree on is the framing, which `sealed.rs` pins with a
# blob the node client produced. hmac stays on 0.12 because it is the half of a matched pair with
# this crate's sha2 0.10, which PKCE uses.
aes-gcm = "0.11"
hmac = "0.12"
hex = "0.4"
# CSPRNG bytes for the PKCE verifier and the OAuth state. getrandom rather than rand for the same
# reason the server picked it: this is the only randomness here.
getrandom = "0.3"
# config.json's oauth.expires_at is an ISO-8601 instant the node CLI also reads and writes. std has
# no calendar.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Run ids and proposal ids. The server issues them and the client parses and echoes them.
uuid = { version = "1", features = ["v4", "serde"] }
# An exclusive flock over the run lock, so two runs on one machine serialise instead of
# interleaving their reads of the same growing file. Pure Rust over libc, no build script.
fs2 = "0.4"
# config.json is replaced by writing a sibling at 0600 and renaming it over the live path; a
# half-written credential file is how a spent refresh token outlives the process that rotated
# it. tempfile is that mechanism maintained by someone else, and it was already in the
# workspace lockfile, so this adds no new version resolution.
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

# ── distribution packages ─────────────────────────────────────────────────────────────────────────
# The binary these package is the musl build, statically linked, so neither package declares a
# runtime dependency and both install on anything with the right architecture. That is unusual for
# a .deb and it is the property worth having: a memory client that refuses to start because the
# host has the wrong libc is a support burden nobody signed up for.

[package.metadata.deb]
maintainer = "Aditya Aggarwal <the-cybersapien@users.noreply.github.com>"
copyright = "2026, lumberroom contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Command line client for a lumberroom memory server. Reads and writes the durable facts every AI \
tool you use shares, seals secrets the server cannot read, and walks transcripts into a review \
queue. The server it talks to is a container image, not this package."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/lumberroom", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lumberroom/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Command line client for a lumberroom memory server"
license = "Apache-2.0"
assets = [
    { source = "target/release/lumberroom", dest = "/usr/bin/lumberroom", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/lumberroom/README.md", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/lumberroom/LICENSE", mode = "644" },
]
