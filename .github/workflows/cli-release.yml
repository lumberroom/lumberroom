# Builds every lumberroom binary a release carries, and attaches them to the release for the tag.
#
# Four targets, a bare binary and an archive each, a .deb and an .rpm for the two linux
# architectures, and one SHA256SUMS covering all of it. The bare binary is for whoever wants one
# file, the .tar.gz is what a Homebrew formula pins a sha256 against, and the distribution packages
# are for the machines where `apt install` and `dnf install` are how software arrives.
#
# The packages carry the musl binary, statically linked, so neither declares a runtime dependency.
# Unusual for a .deb, and the property worth having: a client that will not start because the host
# has the wrong libc is a support burden nobody signed up for.
#
# # Why the linux legs are built here rather than locally
#
# They were not, until v0.1.0. Decision 0012 split them out because scripts/cli-release.sh already
# builds both from the lumberroom-builder image, and a second CI job looked like paying for coverage
# the repo had. What that reasoning missed is that a release nobody can cut without a human running
# a local script first is a release that eventually goes out with half its assets, and the failure
# is silent: the tag exists, the darwin binaries are attached, and `brew install` on linux 404s. The
# cost of the linux jobs is two ubuntu runners at the base rate, which is the cheapest thing in this
# file.
#
# # Native rather than cross
#
# Each musl target builds on a runner of its own architecture, so no cross toolchain and no linker
# flags. It also sidesteps the C in the TLS stack, which is the part that makes cross-compiling
# this client tedious. The local script still cross-compiles, because a Mac has one architecture and
# no choice.
#
# # Cost
#
# macos-14 bills at 10x the linux rate. The darwin job is the whole cost of this workflow, roughly
# fifty linux-equivalent minutes per tag. See docs/decisions/0012-cli-distribution.md.

name: cli-release

on:
  push:
    tags:
      - "v*"
  # A rehearsal. Dispatch builds and attaches against a tag you name, so the first run of any leg
  # is not the real release, where failing leaves a tag with half its assets published.
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and attach to"
        required: true

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.target }}

      - name: build ${{ matrix.target }}
        run: cargo build --release --locked -p lumberroom --target ${{ matrix.target }}

      - name: packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: stage the binary, its archive, and the distribution packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lumberroom" \
            "dist/lumberroom-${version}-${{ matrix.target }}"
          scripts/package-archive.sh \
            "target/${{ matrix.target }}/release/lumberroom" \
            "${{ matrix.target }}" "$version" dist

          # Both tools read target/release/, and the build above wrote to target/<triple>/release/.
          # Copying rather than building again keeps every artifact in this release derived from
          # one compile.
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/lumberroom" target/release/lumberroom

          cargo deb --no-build --no-strip -p lumberroom -o dist/
          cargo generate-rpm -p crates/lumberroom -o dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/lumberroom[-_]*
          if-no-files-found: error

  darwin:
    # The one leg that cannot run anywhere else: there is no osxcross and no zig in this repo's
    # builder image, so a darwin binary needs a darwin runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: rustup targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: build aarch64-apple-darwin
        run: cargo build --release --locked -p lumberroom --target aarch64-apple-darwin

      - name: build x86_64-apple-darwin
        run: cargo build --release --locked -p lumberroom --target x86_64-apple-darwin

      - name: stage the binaries and their archives
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "target/${target}/release/lumberroom" "dist/lumberroom-${version}-${target}"
            scripts/package-archive.sh \
              "target/${target}/release/lumberroom" "$target" "$version" dist
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-darwin
          path: dist/lumberroom[-_]*
          if-no-files-found: error

  attach:
    needs: [linux, darwin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      - name: attach everything, checksummed together
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          repo="$GITHUB_REPOSITORY"
          mkdir -p dist && mv staged/lumberroom[-_]* dist/

          # Every asset in one place before the checksum runs, which is the point of collecting the
          # jobs here rather than having each attach its own. A SHA256SUMS written by one job covers
          # what that job happened to hold.
          cd dist
          sha256sum lumberroom[-_]* > SHA256SUMS
          cat SHA256SUMS
          cd ..

          # A tag carrying a prerelease suffix, v0.1.0-rc.5, is published as one. Without this every
          # rc landed as a normal release and GitHub moved the Latest badge onto it, so the first
          # thing anyone saw on the repository was a release candidate. Semver's rule is the whole
          # test: a hyphen after the version means prerelease.
          prerelease=""
          case "${TAG#v}" in *-*) prerelease="--prerelease" ;; esac

          if ! gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            # The changelog is the release notes. `--generate-notes` lists commits, which on a first
            # release is mostly dependency bumps and says nothing about what this is. Generated
            # notes stay as the fallback for a tag with no section.
            notes="$(awk -v tag="${TAG#v}" '
              $0 ~ "^## \\[" tag "\\]" { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md 2>/dev/null)"
            if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
              gh release create "$TAG" --repo "$repo" --title "lumberroom $TAG" $prerelease \
                --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$TAG" --repo "$repo" --title "lumberroom $TAG" $prerelease \
                --generate-notes
            fi
          fi

          gh release upload "$TAG" --repo "$repo" --clobber dist/lumberroom[-_]* dist/SHA256SUMS
