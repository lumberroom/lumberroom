name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the checkout. The rust-cache and the buildx gha cache authenticate with the
# Actions runtime token, which these scopes do not govern, and the image build never pushes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# dtolnay/rust-toolchain has no versioned releases to pin a major tag against; `@stable` names the
# toolchain channel to install and is the action's own documented way to reference it. Every other
# action below is pinned to a major version tag.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Warnings are allowed for now: the workspace carries some clippy has not been run against
      # yet. Tighten this to `-D warnings` once that backlog is clear.
      - run: cargo clippy --all-targets --workspace

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumberroom
          POSTGRES_PASSWORD: lumberroom
          POSTGRES_DB: lumberroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumberroom -d lumberroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Points at the admin database. The integration suite creates and connects to
      # lumberroom_rust_test itself; see tests/it/integration.rs.
      DATABASE_URL: postgres://lumberroom:lumberroom@localhost:5432/lumberroom
      # The service above always runs, so a database test that would skip fails instead. See
      # tests/common/mod.rs.
      LUMBERROOM_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config g++
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned to the version Dockerfile.builder installs, so CI and `scripts/cargo.sh nextest` run
      # the same runner. Bump both together.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - name: server tests
        # An explicit `shell: bash` is what adds pipefail. The default runs `bash -e` without it,
        # so the step took tee's exit status and passed whatever the runner reported.
        # nextest runs every test in a process of its own. --build-jobs is cargo's -j there; nextest
        # reads -j as the number of tests at once.
        shell: bash
        run: cargo nextest run --build-jobs 1 --no-fail-fast --color never 2>&1 | tee /tmp/server-test.log
      - name: doctests
        # nextest does not run doctests.
        run: cargo test -j 1 --doc
      - name: assert the integration suite actually ran
        # LUMBERROOM_TEST_REQUIRE_DB already fails a test that cannot reach the database. This
        # catches the other way to run nothing: an integration binary that reports no tests. nextest
        # prints one PASS line per test, naming the binary as `lumberroom-server::it`, and this
        # counts them. --color never above keeps escape codes out of the lines.
        run: |
          count=$(grep -cE '^ +PASS .* lumberroom-server::it ' /tmp/server-test.log || true)
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "tests/it ran 0 tests; the database service is not being reached" >&2
            exit 1
          fi
          echo "tests/it passed $count tests"
      - name: client tests
        run: cargo test -j 1 -p lumberroom

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
