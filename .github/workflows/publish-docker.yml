# A published image bakes the default embedding model (EMBED_MODEL in the Dockerfile), so a
# pulled image serves one model. Set EMBED_MODEL when building from source if you need another.
#
# # Why each architecture builds on its own runner
#
# This workflow used to hand both platforms to one buildx invocation behind QEMU. The cli image
# survived that; the server image did not. Cutting v0.1.0-rc.1 left the server job compiling Rust
# for linux/arm64 under emulation for over half an hour with no end in sight, on a build that links
# ONNX Runtime and bakes 209MB of weights. A six hour job limit is not a release process.
#
# Each platform now builds natively, pushes by digest, and a merge job joins the digests into one
# manifest list. The two halves run in parallel rather than one waiting on an emulator, and the tag
# a consumer pulls is identical to what the single-invocation build produced.
name: publish-docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/lumberroom/lumberroom-server
            target: runtime
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: ghcr.io/lumberroom/lumberroom-server
            target: runtime
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: ghcr.io/lumberroom/lumberroom
            target: cli-runtime
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: ghcr.io/lumberroom/lumberroom
            target: cli-runtime
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build stamp /readyz reports and the OCI labels carry. Without it every published image
      # answers `build_sha: unknown`, which is what v0.1.0-rc.4 did: the one field that says which
      # build is running went blank the moment the image came from a registry rather than a local
      # `docker compose build`, where docker-compose.yml passes these already.
      - name: Stamp
        id: stamp
        run: |
          {
            echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)"
            echo "tag=${GITHUB_REF_NAME}"
            echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # No tag here. A digest push per platform, collected by the merge job below, because two
      # runners pushing the same tag would each overwrite the other's manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            LUMBERROOM_BUILD_SHA=${{ steps.stamp.outputs.sha }}
            LUMBERROOM_BUILD_TAG=${{ steps.stamp.outputs.tag }}
            LUMBERROOM_BUILT_AT=${{ steps.stamp.outputs.at }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true

      - name: Record the digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          # Two dashes between the image and the platform. One dash collides: `lumberroom` is a
          # prefix of `lumberroom-server`, so the cli's glob matched the server's artifacts too and
          # the merge asked the cli repository for a digest only the server repository has.
          image_slug="$(echo '${{ matrix.image }}' | tr '/:' '--')"
          platform_slug="$(echo '${{ matrix.platform }}' | tr '/' '-')"
          slug="${image_slug}--${platform_slug}"
          mkdir -p digests
          # The marker file is named for the digest with `sha256:` stripped. An artifact path may
          # not contain a colon, and upload-artifact fails on it after the image has already been
          # pushed, which reads as a failed build and is not one. The prefix goes back on in merge.
          touch "digests/${digest#sha256:}"
          echo "SLUG=$slug" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.SLUG }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - ghcr.io/lumberroom/lumberroom-server
          - ghcr.io/lumberroom/lumberroom
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - name: Join the per-platform digests into one manifest
        run: |
          slug="$(echo '${{ matrix.image }}' | tr '/:' '--')"
          refs=""
          found=0
          for dir in digests/digest-"$slug"--*; do
            [ -d "$dir" ] || continue
            for d in "$dir"/*; do
              refs="$refs ${{ matrix.image }}@sha256:$(basename "$d")"
              found=$((found + 1))
            done
          done

          # One digest per platform, and the matrix builds two. Anything else means the glob picked
          # up an artifact belonging to another image, which is how rc.3 failed: the reference
          # resolves in the repository it came from and nowhere else, and the error names a digest
          # rather than the pattern that collected it.
          expected=2
          if [ "$found" -ne "$expected" ]; then
            echo "collected $found digests for ${{ matrix.image }}, expected $expected" >&2
            echo "refs:$refs" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $refs

      - name: Show what was published
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
