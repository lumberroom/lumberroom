# Lumberroom. One command on any Docker host:
#   ./deploy/install.sh
#
# `server` and `cleanup` pull their published ghcr.io image by default and fall back to building
# from this repo's Dockerfile when the pull fails. install.sh drives that; a plain `docker compose
# up -d` falls back to `build:` on its own whenever the pinned tag is not present locally, which is
# what keeps a development checkout building from source with no flag needed. Override the image
# with LUMBERROOM_SERVER_IMAGE / LUMBERROOM_CLIENT_IMAGE, or force a build with
# `deploy/install.sh --build-local`.
#
# Profiles:
#   (default)  postgres + mcp server, reachable on 127.0.0.1:8787
#   tls        adds Caddy on 80/443 with automatic certificates
#   logto      adds a self-hosted Logto for AUTH_MODE=oidc (bearer and the built-in AUTH_MODE=oauth
#              need neither: see deploy/oauth.md)
#
# The server always gets ./secrets/lumberroom-kek bind-mounted, whether or not KEK_PROVIDER=file is in
# use, so install.sh always creates that file rather than making the compose file's shape depend on
# a choice made in .env. Under the KEK_PROVIDER=file that .env.example ships it holds the live key;
# under `env` install.sh copies its contents into LUMBERROOM_KEK; under `none` it sits unread. Create it
# before the first `up`: Docker answers a missing bind-mount source by creating a directory there,
# and the server then fails to read its own key.
#
# It is a plain bind mount, not a Compose `secrets:` entry. `secrets:` supports per-target
# uid/gid/mode only under Swarm, and under plain `docker compose up` those fields are silently
# ignored: verified empirically, the file lands owned by root:root, mode 0444, regardless of what
# the compose file says. src/crypto/kek.rs refuses a key file readable by group or other, so that
# default would fail every boot with KEK_PROVIDER=file. A bind mount preserves the host file's
# exact owner and mode, which is what makes the permission check satisfiable at all: install.sh
# chowns the file to uid:gid 10001:10001 (the `lumberroom` user and group the Dockerfile pins) and chmods
# it 600 on the host, and the container sees that unchanged.

name: lumberroom

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumberroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lumberroom}
      # Postgres never leaves the box (PRD §8).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker defaults /dev/shm to 64MB. A parallel HNSW build needs far more and fails with
    # "could not resize shared memory segment ... No space left on device", which shows up on a
    # reindex or a restore rather than on first run, so it is exactly the kind of thing that
    # surfaces at the worst moment. Measured: a 100k-row, 768-dim HNSW build wants ~512MB.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumberroom} -d ${POSTGRES_DB:-lumberroom}"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - maintenance_work_mem=512MB

  server:
    build:
      context: .
      # Named, and it has to be. Without a target Docker builds the last stage in the file, which
      # is the client image, and the server would quietly become a container with no server in it.
      target: runtime
      args:
        EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
        EMBED_MODEL: ${EMBED_MODEL:-Xenova/bge-base-en-v1.5}
        # What the binary reports on /readyz and what scripts/deploy-check.sh compares against, so
        # a container serving an image older than the one on disk says so. Compose cannot run
        # `git rev-parse` itself: whoever builds exports these first, and deploy/install.sh does.
        # Unset leaves the stamp `unknown`, which still builds and which deploy-check calls a
        # warning rather than a failure.
        LUMBERROOM_BUILD_SHA: ${LUMBERROOM_BUILD_SHA:-unknown}
        LUMBERROOM_BUILD_TAG: ${LUMBERROOM_BUILD_TAG:-unknown}
        LUMBERROOM_BUILT_AT: ${LUMBERROOM_BUILT_AT:-unknown}
    # Pinned to a tagged release, never `latest`: .github/workflows/publish-docker.yml pushes this
    # exact tag to ghcr.io on every `v*` push, so a version that has not been released yet has no
    # manifest to pull, which is expected and is what sends install.sh to the `build:` block above
    # instead. Override to move versions or to point at a private registry; `deploy/install.sh
    # --build-local` skips the pull and always uses `build:`. A missing local image with `build:`
    # present is what makes a plain `docker compose up -d` in a development checkout build from
    # source the way it always has, with no flag needed.
    image: ${LUMBERROOM_SERVER_IMAGE:-ghcr.io/lumberroom/lumberroom-server:0.4.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-lumberroom}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lumberroom}
      TENANT_ID: ${TENANT_ID:-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Every externally visible URL (MCP endpoint, OAuth issuer, metadata documents, redirect
      # targets) derives from this one setting. Blank falls back to MCP_RESOURCE_URL, then to
      # http://127.0.0.1:8787, fine for the no-domain/token-mode path and invalid for oauth mode,
      # which the server refuses at boot rather than accept a plaintext owner password on the wire.
      PUBLIC_URL: ${PUBLIC_URL:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      AUTH_MODE: ${AUTH_MODE:-token}
      AUTH_TOKENS: ${AUTH_TOKENS:-}
      # AUTH_MODE=oauth (the built-in authorization server, decision 0002).
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:-}
      OAUTH_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET:-}
      OAUTH_DCR_ENABLED: ${OAUTH_DCR_ENABLED:-}
      OAUTH_CODE_TTL_SECS: ${OAUTH_CODE_TTL_SECS:-}
      OAUTH_ACCESS_TTL_SECS: ${OAUTH_ACCESS_TTL_SECS:-}
      OAUTH_REFRESH_TTL_SECS: ${OAUTH_REFRESH_TTL_SECS:-}
      OAUTH_SESSION_TTL_SECS: ${OAUTH_SESSION_TTL_SECS:-}
      OAUTH_DEFAULT_PROFILE: ${OAUTH_DEFAULT_PROFILE:-}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-}
      OAUTH_LOGIN_ATTEMPTS_PER_MINUTE: ${OAUTH_LOGIN_ATTEMPTS_PER_MINUTE:-}
      OAUTH_RESOURCE_AUDIENCE: ${OAUTH_RESOURCE_AUDIENCE:-}
      # AUTH_MODE=oidc (Logto or another external issuer).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      OIDC_REQUIRED_SCOPES: ${OIDC_REQUIRED_SCOPES:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      EMBED_MODEL: ${EMBED_MODEL:-Xenova/bge-base-en-v1.5}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_ALLOW_FALLBACK: ${EMBED_ALLOW_FALLBACK:-false}
      # Sensitivity axis (Phase 3).
      #
      # Blank here means the server reads the `sensitivity_default` table instead, which migration
      # 004 seeds with the same rules .env.example spells out, and falls back to those seeded rules
      # if the table is empty too. It never runs on an empty rule set, because an empty rule set
      # classifies every namespace open. The boot log carries one `classification table` line naming
      # which of the three won.
      SENSITIVITY_DEFAULTS: ${SENSITIVITY_DEFAULTS:-}
      SENSITIVITY_TRIPWIRE: ${SENSITIVITY_TRIPWIRE:-}
      MAX_WRITE_SENSITIVITY: ${MAX_WRITE_SENSITIVITY:-}
      # Key-encryption key. KEK_PATH matches the bind mount target below, which is populated
      # regardless of whether KEK_PROVIDER=file is actually chosen (see the note at the top of
      # this file).
      #
      # .env.example ships KEK_PROVIDER=file, because personal:finance and personal:health classify
      # `private` and a deployment with no key cannot write there at all. The fallback stays `none`
      # here to match what the binary does with the variable unset: an env file that never mentions
      # the KEK gets a server that refuses private writes rather than one hunting for a key file
      # nobody created. Set the value in .env; do not read this line as the default.
      KEK_PROVIDER: ${KEK_PROVIDER:-none}
      KEK_PATH: ${KEK_PATH:-/run/secrets/lumberroom-kek}
      KEK_ENV_VAR: ${KEK_ENV_VAR:-LUMBERROOM_KEK}
      LUMBERROOM_KEK: ${LUMBERROOM_KEK:-}
      KEK_ID: ${KEK_ID:-}
      REQUIRE_VERIFIED_KEK: ${REQUIRE_VERIFIED_KEK:-}
      # Quality (Phase 4).
      DEDUPE_THRESHOLD: ${DEDUPE_THRESHOLD:-}
      CONFLICT_THRESHOLD: ${CONFLICT_THRESHOLD:-}
      CONFLICT_LIMIT: ${CONFLICT_LIMIT:-}
      STALE_DAYS: ${STALE_DAYS:-}
      EXPORT_MAX_SENSITIVITY: ${EXPORT_MAX_SENSITIVITY:-}
      BOOTSTRAP_CACHE_MS: ${BOOTSTRAP_CACHE_MS:-30000}
      BOOTSTRAP_MAX_CHARS_BY_CLIENT: ${BOOTSTRAP_MAX_CHARS_BY_CLIENT:-}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-}
      SEARCH_USAGE_WEIGHT: ${SEARCH_USAGE_WEIGHT:-}
      # Compose passes an explicit map rather than the whole .env, so a variable absent here never
      # reaches the container however the operator sets it. Empty parses as linear.
      SEARCH_FUSION: ${SEARCH_FUSION:-}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-}
    ports:
      # Localhost only: Caddy terminates TLS and proxies in. Nothing else needs this port.
      - "127.0.0.1:${SERVER_PORT:-8787}:8787"
    volumes:
      # See the KEK note at the top of this file for why this is a bind mount and not `secrets:`.
      - ${KEK_SECRET_FILE:-./secrets/lumberroom-kek}:/run/secrets/lumberroom-kek:ro

  # The model half of the cleanup pass, on a wall clock.
  #
  # A separate process, and that is the point rather than a packaging choice. The server runs the
  # deterministic pass on its own timer and holds the key-encryption key; this one calls a provider.
  # Decision 0011 keeps those apart, so no outbound connection to a third party is ever opened from
  # the process holding that key.
  #
  # `restart: unless-stopped` is the whole scheduler. No cron daemon, no crontab to install, no host
  # dependency, and the same `docker compose up -d` that starts everything else. The daemon sleeps
  # to the next wall-clock occurrence of CLEANUP_DAILY_AT rather than counting 24 hours from start,
  # so a restart does not move the run or spend the model call again.
  #
  # Under the `cleanup` profile, so a deployment with no provider key gets nothing running that
  # would fail every night at 04:25.
  cleanup:
    profiles: ["cleanup"]
    # Its own image, because the daemon is not the server. It carries the 5MB client and nothing
    # else: no model weights, no ONNX Runtime, and no reason to grow when the server does.
    build:
      context: .
      target: cli-runtime
      # The same stamp the server gets. It reaches the image labels; the client binary carries no
      # build script, so `lumberroom` itself does not report a commit.
      args:
        LUMBERROOM_BUILD_SHA: ${LUMBERROOM_BUILD_SHA:-unknown}
        LUMBERROOM_BUILD_TAG: ${LUMBERROOM_BUILD_TAG:-unknown}
        LUMBERROOM_BUILT_AT: ${LUMBERROOM_BUILT_AT:-unknown}
    # Same pull-then-build-fallback shape as the server image above, its own variable because the
    # two publish on the same tag but are not the same image.
    image: ${LUMBERROOM_CLIENT_IMAGE:-ghcr.io/lumberroom/lumberroom:0.4.0}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      LUMBERROOM_URL: http://server:8787
      # A client carrying mayIngest. docs/permissions.md covers what that opens and why it is off
      # by default; the token itself never reaches a command line or a crontab.
      # Not `:?`. Compose interpolates every service in the file whether or not its profile is
      # active, so a required variable here would break `docker compose up -d db` for a deployment
      # that never wanted this service. The daemon refuses at startup instead and names the
      # variable, which is the same message one step later.
      LUMBERROOM_TOKEN: ${LUMBERROOM_CLEANUP_TOKEN:-}
      LUMBERROOM_INGEST_KEY_ZAI: ${ZAI_API_KEY:-}
      LUMBERROOM_INGEST_KEY_OPENROUTER: ${OPENROUTER_API_KEY:-}
      # Written where a container can, and never read: `resolve` refuses a config file group or
      # other can read, and the environment is where these keys actually come from.
      LUMBERROOM_CONFIG: /tmp/lumberroom-cleanup.json
    command:
      - lumberroom
      - cleanup
      - daemon
      - --at
      - ${CLEANUP_DAILY_AT:-04:25}
      - --provider
      - ${CLEANUP_PROVIDER:-openrouter}
      - --model
      - ${CLEANUP_MODEL:-qwen/qwen3.7-flash}
      - --min-similarity
      - ${CLEANUP_MIN_SIMILARITY:-0.65}

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - server
    environment:
      LUMBERROOM_DOMAIN: ${LUMBERROOM_DOMAIN:?set LUMBERROOM_DOMAIN in .env for the tls profile}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  logto:
    image: svhd/logto:latest
    profiles: ["logto"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: 1
      DB_URL: postgres://${POSTGRES_USER:-lumberroom}:${POSTGRES_PASSWORD}@db:5432/logto
      ENDPOINT: https://${LOGTO_DOMAIN:-auth.example.com}
      ADMIN_ENDPOINT: https://${LOGTO_ADMIN_DOMAIN:-auth-admin.example.com}
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"

  # The local development loop: `docker compose --profile dev up dev`.
  #
  # Rust has no hot reload and cargo has no watch mode. A running server picks up an edit by being
  # killed and started again, which is what watchexec does here. Nothing swaps code into the live
  # process, so every edit costs a link and a boot; the volumes below exist to keep that cost down.
  #
  # Built from Dockerfile.builder, not Dockerfile. The production image does a release build, bakes
  # 209MB of weights in and asserts the binary size, all of it in service of a shippable artifact
  # and all of it the opposite of a fast edit-to-serving loop. This runs `cargo run` over the
  # bind-mounted tree instead, and tags the image `lumberroom-builder` so scripts/cargo.sh and this
  # service share one toolchain rather than drifting apart.
  #
  # `--profile dev-release`, the profile Cargo.toml already carries for exactly this. The default
  # dev profile builds faster and produces a server slow enough to change what the console feels
  # like; release cannot compile incrementally at all. dev-release is release with the three
  # settings that make it slow to produce turned off.
  #
  # Its own database and its own port. `lumberroom_dev` so a dev-loop restart never writes into the real
  # store, 8788 so it never fights the `server` service for 8787. Create the database once:
  #
  #   docker compose exec db psql -U lumberroom -c 'CREATE DATABASE lumberroom_dev'
  #
  # sqlx migrates it at boot from there. No KEK bind mount: this service is written for
  # KEK_PROVIDER=env, and a missing bind-mount source is the trap at the top of this file, where
  # Docker answers by creating a directory. KEK_PROVIDER=file needs the mount added by hand.
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.builder
    image: lumberroom-builder:latest
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-lumberroom}:${POSTGRES_PASSWORD}@db:5432/${DEV_POSTGRES_DB:-lumberroom_dev}
      TENANT_ID: ${TENANT_ID:-me}
      LOG_LEVEL: ${DEV_LOG_LEVEL:-debug}
      # The published port, not the container port, because PUBLIC_URL is also the Host the MCP
      # transport will answer to. Point it at 8787 and every MCP request arrives with a Host the
      # allowlist rejects, which a client reports as a connection failure.
      PUBLIC_URL: http://127.0.0.1:${DEV_PORT:-8788}
      AUTH_MODE: ${AUTH_MODE:-token}
      AUTH_TOKENS: ${AUTH_TOKENS:-}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:-}
      OAUTH_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET:-}
      OAUTH_DCR_ENABLED: ${OAUTH_DCR_ENABLED:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      OIDC_REQUIRED_SCOPES: ${OIDC_REQUIRED_SCOPES:-}
      # The real embedder, reading weights from a volume seeded once. A hash embedder would boot
      # faster and would give this loop different vectors from the ones production returns, which
      # is the wrong thing to be debugging against.
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      EMBED_MODEL: ${EMBED_MODEL:-Xenova/bge-base-en-v1.5}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_ALLOW_FALLBACK: ${EMBED_ALLOW_FALLBACK:-false}
      MODEL_CACHE_DIR: /models
      SENSITIVITY_DEFAULTS: ${SENSITIVITY_DEFAULTS:-}
      SENSITIVITY_TRIPWIRE: ${SENSITIVITY_TRIPWIRE:-}
      MAX_WRITE_SENSITIVITY: ${MAX_WRITE_SENSITIVITY:-}
      KEK_PROVIDER: ${KEK_PROVIDER:-none}
      KEK_ENV_VAR: ${KEK_ENV_VAR:-LUMBERROOM_KEK}
      LUMBERROOM_KEK: ${LUMBERROOM_KEK:-}
      KEK_ID: ${KEK_ID:-}
      REQUIRE_VERIFIED_KEK: ${REQUIRE_VERIFIED_KEK:-}
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    ports:
      - "127.0.0.1:${DEV_PORT:-8788}:8787"
    volumes:
      - .:/app
      # target/ off the bind mount, and the same volume scripts/cargo.sh uses, so one checkout has
      # one build directory rather than one here and one on the host. Rust build I/O through
      # virtiofs dominates a rebuild otherwise, and a named volume shadows the bind-mounted
      # subdirectory cleanly.
      - target:/app/target
      # The same registry scripts/cargo.sh already uses, by its exact name rather than the
      # project-prefixed one compose would invent.
      - cargo_registry:/usr/local/cargo/registry
      # Seed once from the image that already carries them, no download:
      #   docker run --rm --user root --entrypoint sh -v lumberroom-dev-models:/dst lumberroom-server:0.4.0 \
  #     -c 'cp -a /models/. /dst/ && chmod -R a+rX /dst'
  #
  # The chmod is what lets the dev loop read them: this service now runs as the uid that owns the
  # target volume rather than as root, and root's copy is otherwise readable only by accident.
      - dev_models:/models
    # --poll is the escape hatch, not the default: file events from a macOS bind mount into a Linux
    # container go missing often enough to be worth naming, and polling costs CPU the whole time it
    # is on. Add `--poll 500ms` here when saves stop triggering rebuilds.
    command:
      - watchexec
      - --restart
      - --watch
      - src
      - --watch
      - migrations
      - --exts
      - rs,sql
      - --
      - cargo
      - run
      - --profile
      - dev-release
      - --bin
      - lumberroom-server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  target:
    name: lumberroom-target
  dev_models:
    name: lumberroom-dev-models
  cargo_registry:
    name: lumberroom-cargo
