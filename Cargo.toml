[workspace]
# The server stays the root package, so the Dockerfile, the image build and every existing path are
# untouched. lumberroom is a second member rather than a cargo feature because features are
# crate-wide: a client living in this crate would link fastembed and carry 209MB of model weights
# into a tool that embeds nothing.
members = ["crates/archive", "crates/lumberroom"]
resolver = "2"

[package]
name = "lumberroom-server"
version = "0.4.0"
edition = "2021"
rust-version = "1.83"
description = "Durable memory control plane. MCP server over Postgres and pgvector."
license = "Apache-2.0"
repository = "https://github.com/the-cybersapien/lumberroom"
homepage = "https://lumberroom.cloud"
readme = "README.md"
keywords = ["mcp", "memory", "postgres", "pgvector", "llm"]
categories = ["database", "asynchronous"]
# The server is a deployed binary, not a library anyone pulls from crates.io.
publish = false
# There are two binaries: the server and the build-time model prefetch.
default-run = "lumberroom-server"

[[bin]]
name = "lumberroom-server"
path = "src/main.rs"

[dependencies]
# MCP. Streamable HTTP server transport, mounted as an axum service.
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"

# Storage. Every statement goes through query/query_as with .bind(); the compile-time macros stay
# unused, so dynamic SQL built with format! fails to type-check instead of reaching the database.
# The version must match the one pgvector resolves.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
pgvector = { version = "0.4", features = ["sqlx", "postgres"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Embeddings. bge-base-en-v1.5 q8, the model already measured on arm64.
fastembed = "6"

# Auth. jsonwebtoken validates an external issuer's JWTs; everything else here belongs to the
# built-in authorization server (decision 0002).
jsonwebtoken = "11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
subtle = "2"
sha2 = "0.11"
hex = "0.4"
# Owner password verification. Argon2id, so a stolen .env hash is not a password.
argon2 = "0.5"
# Signed authorization-server cookies, and the sealed-item key derivation.
hmac = "0.13"
base64 = "0.22"
# Redirect URIs are compared exactly, but they are validated structurally before registration.
url = "2"

# The archive format. Its own crate because the CLI and the server both read it, and neither should
# carry the other's dependency tree to do so.
lumberroom-archive = { path = "crates/archive" }
# The passphrase type age takes, pinned to the major `crates/archive` pins. Two majors here and
# `Sealing::Passphrase` becomes unconstructible from this crate.
secrecy = "0.10"

# Crypto for the private sensitivity level (Phase 3). getrandom rather than rand: the only
# randomness this service needs is CSPRNG bytes, and it avoids the rand_core version split
# between rand 0.9 and the RustCrypto stack.
aes-gcm = "0.11"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
# Needed for dyn-dispatched async traits; native async-fn-in-trait is not dyn-safe.
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.dev]
# Line tables instead of full DWARF. The dev profile links 157 test executables, each one
# statically carrying its own copy of the debug info for the whole tree, and the default
# `debug = true` makes that copy enormous: measured on debug/deps/console, a 410MB binary
# held 315MB of debug sections, 271MB of it .debug_info and .debug_str. Stripped, the same
# binary is 54MB. Multiply by the 34 test binaries over 100MB and it was 11.3GB of the
# volume's 19GB deps directory.
#
# `line-tables-only` keeps .debug_line, which is what RUST_BACKTRACE=1 reads to print file
# and line numbers, and drops the type and variable names that only a debugger consumes.
# A panic in a test still names the file and the line. Stepping through Rust in gdb or lldb
# is what this gives up; nobody on this repo was doing that.
#
# It buys link time as well as disk. The linker OOM that forces `-j 1` on `test` in
# scripts/cargo.sh is the linker being handed 315MB of debug info per binary inside a
# container with a 6.2GB ceiling. Less to write is less to hold.
debug = "line-tables-only"

[profile.dev.package."*"]
# No debug info at all for third-party crates. `line-tables-only` above still applies to this
# workspace, so a backtrace keeps its file and line for every frame in code anybody here can edit.
# What this drops is the line numbers on frames inside axum, sqlx, tokio and the rest, which are
# not addresses anybody debugs by.
#
# Dependencies are most of the remaining weight. On debug/deps/console after line-tables-only,
# 71MB of the 159MB binary was still debug sections, and .debug_line and .debug_str carry an entry
# for every dependency frame linked in. There are 1,456 rlibs in this tree.
#
# `"*"` is every package that is not a workspace member, which is the whole point: it needs no
# maintenance as dependencies come and go, unlike naming crates one at a time.
debug = 0

[profile.release]
# One binary on a small ARM box. Optimise for size and link-time work over compile speed.
#
# codegen-units = 4 rather than 1. At 1 the whole crate is a single unit, so codegen runs on one
# core and seven idle; the compile is the slowest part of every build for that reason alone. The
# cost of 4 is less inlining across unit boundaries, and thin LTO already recovers most of that at
# link time, which is the argument for pairing them. It is a real cost rather than a free win, so
# it wants measuring against the binary it replaces: size, and a run of the recall monitor.
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true

# The same binary, built for a person who is waiting rather than for a small ARM box.
#
# `inherits = "release"`, then undoes the three settings that make a release build slow to produce.
# `codegen-units = 1` is the expensive one: it puts the whole crate in a single unit, so codegen has
# no parallelism at all and seven of eight cores idle through the longest phase. A single unit and
# thin LTO also make incremental compilation impossible, which is why it can only be switched on
# once those are relaxed.
#
# Production is untouched. `cargo build --release` still reads the block above and produces exactly
# the binary it did before. Nothing here reaches it: this profile is for scripts/dev.sh and for
# nothing that ships.
#
# The binary it produces is slower at runtime and larger on disk. On a laptop, against a store this
# size, neither costs anything anybody can feel.
[profile.dev-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
# The console reads its stylesheet from disk behind `cfg(debug_assertions)`, which release turns
# off and this profile would inherit. Without this line the dev loop serves the stylesheet that was
# compiled in, and a CSS edit looks like it did nothing.
debug-assertions = true
